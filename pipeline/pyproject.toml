[project]
name = "reconstruct"
version = "0.1.0"
description = "Build and validate traffic-incident scene packages."
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1",
  "sympy>=1.13",
  "scipy>=1.11",
  "pydantic>=2.7",
  "typer>=0.12",
  "jsonschema>=4.23",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
reconstruct = "reconstruct.cli:app"
export-collision-trajectories = "reconstruct.collision_export:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
